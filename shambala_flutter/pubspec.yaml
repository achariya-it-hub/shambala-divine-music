name: shambala_flutter
description: "A Spotify-like divine songs music app with offline caching, automated 12:00 PM meditation engine, and admin dashboard for iOS & Android."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  dio: ^5.4.1
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
