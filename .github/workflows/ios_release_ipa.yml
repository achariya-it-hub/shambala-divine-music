name: Build iOS Release IPA

on:
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: shambala_flutter
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: shambala_flutter/ios
        run: pod install

      - name: Build iOS Release Archive (No Codesign)
        working-directory: shambala_flutter
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into .ipa
        working-directory: shambala_flutter/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Shambala_Music_v1.0.2+3_ios.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shambala_Music_iOS_IPA
          path: shambala_flutter/build/ios/iphoneos/Shambala_Music_v1.0.2+3_ios.ipa

